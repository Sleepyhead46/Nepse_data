name: update-nepse-data

on:
  schedule:
    # Runs daily at 4:30 PM NPT (10:45 UTC)
    - cron: "45 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs so overlapping manual/scheduled triggers can't race on commits
concurrency:
  group: nepse-data-update
  cancel-in-progress: false

defaults:
  run:
    working-directory: ./src

jobs:
  update-data:
    name: Scrape & Commit NEPSE Data (4:30 PM NPT Daily)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # requirements.txt lives at the repo root, not in src/
      - name: Install dependencies
        run: pip install -r "$GITHUB_WORKSPACE/requirements.txt"

      - name: Run scrapers (discovery → daily → hourly → minute)
        run: python runAllScrapers.py

      - name: Configure git identity
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push updated data files
        run: |
          git add ../data
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: auto-update NEPSE daily, hourly & minute data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push origin main
          fi
