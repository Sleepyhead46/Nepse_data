name: update-nepse-data

on:
  schedule:
    # Monday-Friday at 4:30 PM NPT (10:45 UTC)
    - cron: "45 10 * * 1-5"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ./src

jobs:
  update-data:
    name: Scrape & Commit NEPSE Data
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # --------------------------------------------------
      # 3. Upgrade pip
      # --------------------------------------------------
      - name: Upgrade pip
        working-directory: .
        run: |
          python -m pip install --upgrade pip

      # --------------------------------------------------
      # 4. Install Python dependencies
      # requirements.txt is in repository root
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install -r requirements.txt

      # --------------------------------------------------
      # 5. Run all NEPSE scrapers
      # --------------------------------------------------
      - name: Run scrapers
        run: |
          python runAllScrapers.py

      # --------------------------------------------------
      # 6. Configure Git
      # --------------------------------------------------
      - name: Configure git identity
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # --------------------------------------------------
      # 7. Check generated data
      # --------------------------------------------------
      - name: Check data changes
        working-directory: .
        run: |
          echo "Checking for updated NEPSE data..."
          git status --short

      # --------------------------------------------------
      # 8. Commit and push updated data
      # --------------------------------------------------
      - name: Commit and push updated data files
        working-directory: .
        run: |
          git add data

          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: auto-update NEPSE data [$(date -u +'%Y-%m-%d %H:%M UTC')]"

            git pull --rebase origin main

            git push origin main
          fi
