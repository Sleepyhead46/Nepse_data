name: update-nepse-data

on:
  schedule:
    # Monday-Friday at 4:30 PM NPT (10:45 UTC)
    - cron: "45 10 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ./src

jobs:
  update-data:
    name: Scrape & Commit NEPSE Data
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Python 3.10
      # --------------------------------------------------
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # --------------------------------------------------
      # 4. Sync with latest main BEFORE scraper runs
      # --------------------------------------------------
      - name: Sync repository
        working-directory: .
        run: |
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      # --------------------------------------------------
      # 5. Run all NEPSE scrapers
      # --------------------------------------------------
      - name: Run scrapers
        run: |
          python runAllScrapers.py

      # --------------------------------------------------
      # 6. Show generated changes
      # --------------------------------------------------
      - name: Check changes
        working-directory: .
        run: |
          echo "Git status:"
          git status --short

          echo ""
          echo "Changed files:"
          git diff --name-only

      # --------------------------------------------------
      # 7. Configure Git
      # --------------------------------------------------
      - name: Configure git identity
        working-directory: .
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      # --------------------------------------------------
      # 8. Commit updated data
      # --------------------------------------------------
      - name: Commit updated data
        working-directory: .
        run: |
          git add data

          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: auto-update NEPSE data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          fi

      # --------------------------------------------------
      # 9. Push changes
      # --------------------------------------------------
      - name: Push changes
        working-directory: .
        run: |
          if git diff --quiet HEAD origin/main; then
            echo "No changes to push."
            exit 0
          fi

          git push origin HEAD:main
