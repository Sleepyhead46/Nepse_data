name: update-nepse-data

on:
  schedule:
    # Runs daily at 5:00 PM NPT (11:15 UTC)
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ./src

jobs:
  update-data:
    name: Scrape & Commit NEPSE Data (5:00 PM NPT Daily)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrapers (discovery → daily → hourly → minute)
        run: python runAllScrapers.py

      - name: Configure git identity
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit updated data files
        run: |
          git add -A
          git commit -m "chore: auto-update NEPSE daily, hourly & minute data [$(date -u +'%Y-%m-%d %H:%M UTC')]" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
