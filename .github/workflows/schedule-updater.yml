name: update-companies-data

on:
  schedule:
    # Runs hourly during NEPSE trading hours (Sun-Thu, 11:00 AM - 3:00 PM NPT -> 05:15 to 09:15 UTC)
    - cron: "15 5,6,7,8,9 * * 0,1,2,3,4"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ./src

jobs:
  update-all-data:
    name: update-all-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install packages
        run: pip install -r requirements.txt
      - name: Run all data scrapers
        run: python runAllScrapers.py
      - name: Setup Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Commit Data Files
        run: |
          git add -A
          git commit -m "Auto-update all NEPSE daily, hourly, and historical stock data" || echo "No changes to commit"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
